name: Publish to npm

# Called by the release workflow once the binaries are uploaded, or run by hand for an
# existing release (without rebuilding, and so without changing, the release binaries).
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (e.g. v0.5.1)
        required: true

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # setup-node puts a placeholder in NODE_AUTH_TOKEN when the secret is empty, so test the secret itself
      HAVE_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish
        run: |
          if [ "$HAVE_NPM_TOKEN" != true ]; then echo "::notice::NPM_TOKEN secret not set; skipping npm publish"; exit 0; fi
          out=$(mktemp -d)
          npm/build.sh "$TAG" "$out"
          # platform packages first, so the launcher's optionalDependencies resolve
          for p in safesweep-linux-x64 safesweep-linux-arm64 safesweep; do
            if npm view "$p@${TAG#v}" version >/dev/null 2>&1; then echo "$p@${TAG#v} already published"; continue; fi
            (cd "$out/$p" && npm publish --provenance --access public)
          done
