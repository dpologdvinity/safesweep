# Publishes the npm packages (`safesweep` and its two platform packages) so npm, pnpm, yarn and bun
# can install the tool. See npm/build.sh for how they are built from the release binaries.
# Prereleases go under the `next` dist-tag, so `npm install safesweep` never picks them up.
# Authenticates with npm trusted publishing (OIDC): there is no npm token. See npm/publish.sh for the
# publishing loop. The trusted-publisher setting of each package on npmjs.com names THIS file, so
# renaming or splitting it breaks publishing until that setting is updated.
name: Publish to npm

# Runs after "Release binaries" succeeds (the npm packages are built from those binaries), or by
# hand for an existing release without rebuilding, and so without changing, the binaries.
# A top-level workflow, not a reusable one: npm trusted publishing checks this file's name.
on:
  workflow_run:
    workflows: ["Release binaries"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (e.g. v0.5.1)
        required: true

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  # A hand-run "Release binaries" is not tied to a release tag, so only follow release-triggered runs.
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'release')
    uses: ./.github/workflows/verify-tag.yml
    with:
      # for a release-triggered run, head_branch is the release tag
      tag: ${{ inputs.tag || github.event.workflow_run.head_branch }}

  publish:
    needs: verify
    runs-on: ubuntu-latest
    env:
      # for a release-triggered run, head_branch is the release tag
      TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24 # trusted publishing needs npm >= 11.5.1
          registry-url: https://registry.npmjs.org
      - name: Build the packages from the release binaries
        id: build
        env:
          KIND: ${{ needs.verify.outputs.kind }}
        run: |
          out=$(mktemp -d)
          npm/build.sh "$TAG" "$out"
          # prereleases go to the `next` dist-tag so `npm install safesweep` never picks them up
          dist=latest; [ "$KIND" = prerelease ] && dist=next
          echo "out=$out" >> "$GITHUB_OUTPUT"
          echo "dist=$dist" >> "$GITHUB_OUTPUT"
      # npm trusted publishing (OIDC). No token exists anywhere: npm exchanges this run's GitHub
      # identity for a short-lived publish credential, and the packages are set on npmjs.com to
      # refuse token publishing. publish.sh skips versions that are already published, so a failed
      # run can simply be repeated: `gh workflow run npm.yml -f tag=vX.Y.Z`.
      - name: Publish with trusted publishing
        env:
          OUT: ${{ steps.build.outputs.out }}
          DIST: ${{ steps.build.outputs.dist }}
        run: npm/publish.sh "$TAG" "$DIST" "$OUT"
