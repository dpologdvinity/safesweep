name: Publish to npm

# Runs after "Release binaries" succeeds (the npm packages are built from those binaries), or by
# hand for an existing release without rebuilding, and so without changing, the binaries.
# A top-level workflow, not a reusable one: npm trusted publishing checks this file's name.
on:
  workflow_run:
    workflows: ["Release binaries"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (e.g. v0.5.1)
        required: true

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    # a hand-run "Release binaries" is not tied to a release tag, so only follow release-triggered runs
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'release')
    runs-on: ubuntu-latest
    env:
      # for a release-triggered run, head_branch is the release tag
      TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Tag must look like a release tag before it is used anywhere
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::'$TAG' is not a release tag"; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - id: v
        run: echo "kind=$(.github/scripts/verify-tag.sh "$TAG")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24 # trusted publishing needs npm >= 11.5.1
          registry-url: https://registry.npmjs.org
      - name: Publish
        env:
          KIND: ${{ steps.v.outputs.kind }}
        run: |
          # Uses npm trusted publishing (OIDC) when it is configured on npmjs.com; NPM_TOKEN, if set,
          # is only a fallback and can be deleted once trusted publishing works.
          # prereleases go to the `next` dist-tag so `npm install safesweep` never picks them up
          dist=latest; [ "$KIND" = prerelease ] && dist=next
          out=$(mktemp -d)
          npm/build.sh "$TAG" "$out"
          # platform packages first, so the launcher's optionalDependencies resolve
          for p in safesweep-linux-x64 safesweep-linux-arm64 safesweep; do
            if npm view "$p@${TAG#v}" version >/dev/null 2>&1; then echo "$p@${TAG#v} already published"; continue; fi
            (cd "$out/$p" && npm publish --provenance --access public --tag "$dist")
          done
