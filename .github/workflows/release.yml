name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)publish (e.g. v0.6.0). Only tags made with this workflow in place work.
        required: true

permissions:
  contents: read

jobs:
  # Everything below waits for this: a tag that is not vX.Y.Z[-pre], or does not match Cargo.toml,
  # must not publish binaries, packages, the apt repo or a crate.
  verify:
    uses: ./.github/workflows/verify-tag.yml
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}

  linux:
    needs: verify
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false # build scripts of dependencies run below; keep the token out of .git
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-deb@3.8.0,cargo-generate-rpm@0.21.1
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name=safesweep-${TAG}-${{ matrix.target }}
          packaging/gen-extras.sh target/${{ matrix.target }}/release/safesweep
          mkdir "$name"
          cp target/${{ matrix.target }}/release/safesweep README.md LICENSE-MIT LICENSE-APACHE "$name"/
          cp target/extras/* "$name"/
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          # static musl binary, so the .deb/.rpm have no library dependencies
          cargo deb --no-build --target ${{ matrix.target }} -o .
          cargo generate-rpm --target ${{ matrix.target }} -o .
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        # Never replace an asset: a rebuild is not byte-identical, and Homebrew and the apt repo
        # pin the checksums of what was published first.
        run: |
          existing=$(gh release view "$TAG" --json assets -q '.assets[].name')
          have() { grep -qxF "$1" <<<"$existing"; }
          tarball=$(ls safesweep-*.tar.gz)
          for f in "$tarball" safesweep*.deb safesweep*.rpm; do
            if have "$f"; then echo "keeping existing $f"; else gh release upload "$TAG" "$f"; fi
          done
          if ! have "$tarball.sha256"; then
            if have "$tarball"; then
              # an earlier run's tarball is the reference: its checksum, not this run's rebuild
              d=$(mktemp -d)
              gh release download "$TAG" -p "$tarball" -D "$d"
              (cd "$d" && sha256sum "$tarball") > "$tarball.sha256"
            fi
            gh release upload "$TAG" "$tarball.sha256"
          fi

  # Signed apt repository on GitHub Pages (gh-pages branch), rebuilt from this release's .debs.
  # It serves one version, the latest stable release.
  apt:
    needs: [verify, linux]
    if: needs.verify.outputs.kind == 'stable'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # two runs must not interleave their force-pushes
    concurrency:
      group: apt-repo
      cancel-in-progress: false
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      APT_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Build and publish
        run: |
          if [ -z "$APT_KEY" ]; then echo "::notice::APT_GPG_PRIVATE_KEY not set; skipping apt repo"; exit 0; fi
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" -q .tag_name)
          if [ "$TAG" != "$latest" ]; then
            echo "::notice::$TAG is not the latest release ($latest); leaving the apt repo alone"
            exit 0
          fi
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          gpg --batch --import <<<"$APT_KEY"
          fp=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          debs=$(mktemp -d) site=$(mktemp -d)
          gh release download "$TAG" -p '*.deb' -D "$debs"
          apt/build.sh "$debs" "$site" "$fp"
          cd "$site"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "apt repository for $TAG"
          # generated content: the branch always holds just the latest release
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

  # crates.io: trusted publishing when it is configured on crates.io, otherwise the
  # CARGO_REGISTRY_TOKEN secret. Skips a version that is already published.
  crates:
    needs: [verify, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Check version
        id: check
        run: |
          ver=${TAG#v}
          code=$(curl -s -o /dev/null -w '%{http_code}' -A "safesweep-release (github.com/dpologdvinity/safesweep)" "https://crates.io/api/v1/crates/safesweep/$ver")
          if [ "$code" = 200 ]; then echo "safesweep $ver already on crates.io"; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        if: steps.check.outputs.skip != 'true'
        id: auth
        continue-on-error: true # not configured yet: fall back to the token secret
      - if: steps.check.outputs.skip != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
