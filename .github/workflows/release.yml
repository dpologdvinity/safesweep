name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach binaries to (e.g. v0.3.1)
        required: true

permissions:
  contents: write

jobs:
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name=safesweep-${TAG}-${{ matrix.target }}
          packaging/gen-extras.sh target/${{ matrix.target }}/release/safesweep
          mkdir "$name"
          cp target/${{ matrix.target }}/release/safesweep README.md LICENSE-MIT LICENSE-APACHE "$name"/
          cp target/extras/* "$name"/
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          # static musl binary, so the .deb/.rpm have no library dependencies
          cargo deb --no-build --target ${{ matrix.target }} -o .
          cargo generate-rpm --target ${{ matrix.target }} -o .
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        # Never replace an asset: a rebuild is not byte-identical, and Homebrew and the apt repo
        # pin the checksums of what was published first.
        run: |
          existing=$(gh release view "$TAG" --json assets -q '.assets[].name')
          for f in safesweep-*.tar.gz safesweep-*.tar.gz.sha256 safesweep*.deb safesweep*.rpm; do
            if grep -qxF "$f" <<<"$existing"; then echo "keeping existing $f"; continue; fi
            gh release upload "$TAG" "$f"
          done

  # Signed apt repository on GitHub Pages (gh-pages branch), rebuilt from this release's .debs.
  apt:
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      APT_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TAG }}
      - name: Build and publish
        run: |
          if [ -z "$APT_KEY" ]; then echo "::notice::APT_GPG_PRIVATE_KEY not set; skipping apt repo"; exit 0; fi
          export GNUPGHOME=$(mktemp -d)
          gpg --batch --import <<<"$APT_KEY"
          fp=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          debs=$(mktemp -d) site=$(mktemp -d)
          gh release download "$TAG" -p '*.deb' -D "$debs"
          apt/build.sh "$debs" "$site" "$fp"
          cd "$site"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "apt repository for $TAG"
          # generated content: the branch always holds just the latest release
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

  # crates.io: trusted publishing when it is configured on crates.io, otherwise the
  # CARGO_REGISTRY_TOKEN secret. Skips a version that is already published.
  crates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Check version
        id: check
        run: |
          ver=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          [ "v$ver" = "$TAG" ] || { echo "::error::tag $TAG does not match Cargo.toml version $ver"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -A "safesweep-release (github.com/dpologdvinity/safesweep)" "https://crates.io/api/v1/crates/safesweep/$ver")
          if [ "$code" = 200 ]; then echo "safesweep $ver already on crates.io"; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        if: steps.check.outputs.skip != 'true'
        id: auth
        continue-on-error: true # not configured yet: fall back to the token secret
      - if: steps.check.outputs.skip != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
