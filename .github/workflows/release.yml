name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach binaries to (e.g. v0.3.1)
        required: true

permissions:
  contents: write

jobs:
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name=safesweep-${TAG}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/safesweep README.md LICENSE-MIT LICENSE-APACHE "$name"/
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          # static musl binary, so the .deb/.rpm have no library dependencies
          cargo deb --no-build --target ${{ matrix.target }} -o .
          cargo generate-rpm --target ${{ matrix.target }} -o .
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" safesweep-*.tar.gz safesweep-*.tar.gz.sha256 safesweep*.deb safesweep*.rpm --clobber

  # Runs after the binaries are on the release: the npm packages are built from them.
  npm:
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # setup-node puts a placeholder in NODE_AUTH_TOKEN when the secret is empty, so test the secret itself
      HAVE_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish
        run: |
          if [ "$HAVE_NPM_TOKEN" != true ]; then echo "::notice::NPM_TOKEN secret not set; skipping npm publish"; exit 0; fi
          out=$(mktemp -d)
          npm/build.sh "$TAG" "$out"
          # platform packages first, so the launcher's optionalDependencies resolve
          for p in safesweep-linux-x64 safesweep-linux-arm64 safesweep; do
            if npm view "$p@${TAG#v}" version >/dev/null 2>&1; then echo "$p@${TAG#v} already published"; continue; fi
            (cd "$out/$p" && npm publish --provenance --access public)
          done

  # Signed apt repository on GitHub Pages (gh-pages branch), rebuilt from this release's .debs.
  apt:
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      APT_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TAG }}
      - name: Build and publish
        run: |
          if [ -z "$APT_KEY" ]; then echo "::notice::APT_GPG_PRIVATE_KEY not set; skipping apt repo"; exit 0; fi
          export GNUPGHOME=$(mktemp -d)
          gpg --batch --import <<<"$APT_KEY"
          fp=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          debs=$(mktemp -d) site=$(mktemp -d)
          gh release download "$TAG" -p '*.deb' -D "$debs"
          apt/build.sh "$debs" "$site" "$fp"
          cd "$site"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "apt repository for $TAG"
          # generated content: the branch always holds just the latest release
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
