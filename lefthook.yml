# Git hooks managed by lefthook (https://lefthook.dev).
# Enable locally with `lefthook install`; skip once with `LEFTHOOK=0 git commit`.
pre-commit:
  parallel: true
  commands:
    gitleaks:
      # Block commits that stage secrets (API keys, tokens, passwords).
      run: gitleaks git --staged --no-banner --redact
    rustfmt:
      glob: "*.rs"
      run: cargo fmt --all -- --check
    typos:
      # typos would scan binary assets when handed explicit paths.
      exclude: "*.{gif,png,jpg,jpeg,webp,ico,svg,pdf,woff,woff2,ttf}"
      run: typos --force-exclude {staged_files}
pre-push:
  commands:
    clippy:
      glob: "*.rs"
      run: cargo clippy --locked --all-targets -- -D warnings
