[package]
name = "safesweep"
version = "0.2.0"
edition = "2024"
description = "Clean caches and temp files that are provably safe to delete"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/dpologdvinity/safesweep"
keywords = ["cache", "cleanup", "disk", "wsl", "cli"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.2.2"
filetime = "0.2.29"
tempfile = "3.27.0"
