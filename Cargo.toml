# safesweep: one crate that is both a library (src/lib.rs, the logic) and a program
# (src/main.rs, the command line). See ARCHITECTURE.md. Release steps are in RELEASING.md.
[package]
name = "safesweep"
version = "0.6.2"
edition = "2024"
# let-chains in `if let ... && let ...` need 1.88
rust-version = "1.88"
description = "Clean caches and temp files that are provably safe to delete"
license = "MIT OR Apache-2.0"
readme = "README.md"
# packaging and demo files for other channels; not part of the crate
exclude = ["/demo", "/npm", "/apt", "/flake.nix", "/pyproject.toml", "/.github", "/RELEASING.md", "/packaging", "/CONTRIBUTING.md", "/SECURITY.md", "/lychee.toml"]
repository = "https://github.com/dpologdvinity/safesweep"
keywords = ["cache", "cleanup", "disk", "wsl", "cli"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] } # command-line parsing and --help
clap_complete = "4.6.11" # `safesweep completions <shell>`
clap_mangen = "0.3.3" # `safesweep man`
libc = "0.2.191" # geteuid, makedev
ratatui = "0.30.2" # the `tui` screen (with its bundled crossterm for keys)
rayon = "1.12.0" # scan rules and candidates in parallel
serde = { version = "1.0.229", features = ["derive"] } # JSON output
serde_json = "1.0.154"
walkdir = "2.5.0" # directory walks that do not follow symlinks

[dev-dependencies]
assert_cmd = "2.2.2" # run the built binary in integration tests
filetime = "0.2.29" # set modification times of test files
tempfile = "3.27.0" # throwaway directories for every test

# `cargo binstall safesweep` downloads the release tarball instead of compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-x86_64-unknown-linux-musl.tar.gz"
bin-dir = "{ name }-v{ version }-x86_64-unknown-linux-musl/{ bin }"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-aarch64-unknown-linux-musl.tar.gz"
bin-dir = "{ name }-v{ version }-aarch64-unknown-linux-musl/{ bin }"

[package.metadata.deb]
maintainer = "Kaitlyn Bassford <kaitlynbassford@gmail.com>"
section = "utils"
priority = "optional"
extended-description = "Deletes cache and temp files only when it can prove they are safe: nothing open, nothing recent, nothing shared. Also shows what is using the CPU (safesweep why) and has an interactive explorer (safesweep tui)."
assets = [
    ["target/release/safesweep", "usr/bin/", "755"],
    ["target/extras/safesweep.1", "usr/share/man/man1/safesweep.1", "644"],
    ["target/extras/safesweep.bash", "usr/share/bash-completion/completions/safesweep", "644"],
    ["target/extras/_safesweep", "usr/share/zsh/vendor-completions/_safesweep", "644"],
    ["target/extras/safesweep.fish", "usr/share/fish/vendor_completions.d/safesweep.fish", "644"],
    ["README.md", "usr/share/doc/safesweep/README.md", "644"],
    ["LICENSE-MIT", "usr/share/doc/safesweep/LICENSE-MIT", "644"],
    ["LICENSE-APACHE", "usr/share/doc/safesweep/LICENSE-APACHE", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/safesweep", dest = "/usr/bin/safesweep", mode = "755" },
    { source = "target/extras/safesweep.1", dest = "/usr/share/man/man1/safesweep.1", mode = "644" },
    { source = "target/extras/safesweep.bash", dest = "/usr/share/bash-completion/completions/safesweep", mode = "644" },
    { source = "target/extras/_safesweep", dest = "/usr/share/zsh/site-functions/_safesweep", mode = "644" },
    { source = "target/extras/safesweep.fish", dest = "/usr/share/fish/vendor_completions.d/safesweep.fish", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/safesweep/README.md", mode = "644", doc = true },
    { source = "LICENSE-MIT", dest = "/usr/share/licenses/safesweep/LICENSE-MIT", mode = "644", doc = true },
    { source = "LICENSE-APACHE", dest = "/usr/share/licenses/safesweep/LICENSE-APACHE", mode = "644", doc = true },
]
